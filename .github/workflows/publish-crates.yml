name: Publish crates

# Called by release.yml (dist) once a version tag's artifacts are hosted.
# Publishes every publishable workspace crate to crates.io, in dependency
# order. A published version can be yanked but never replaced: a fix always
# ships as a new version. See docs/releasing.md.

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

permissions:
  contents: read

jobs:
  crates:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --workspace --locked
