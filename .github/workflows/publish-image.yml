name: Publish router image

# Called by release.yml (dist) once a version tag's artifacts are hosted.
# Builds the router image and pushes it to ghcr.io as `<version>` and
# `latest`. Plain docker commands, so there is no third-party action to pin.
# See docs/releasing.md.

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      IMAGE: ghcr.io/sealmesh/sealmesh-server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Version from the release plan
        id: version
        env:
          PLAN: ${{ inputs.plan }}
        run: |
          set -euo pipefail
          tag=$(printf '%s' "$PLAN" | jq -r '.announcement_tag')
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Build
        run: |
          docker build \
            --label org.opencontainers.image.source=https://github.com/SealMesh/sealmesh \
            --label org.opencontainers.image.licenses=AGPL-3.0-only \
            --label org.opencontainers.image.version=${{ steps.version.outputs.version }} \
            -t "$IMAGE:${{ steps.version.outputs.version }}" -t "$IMAGE:latest" .

      - name: Push
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "$IMAGE:${{ steps.version.outputs.version }}"
          docker push "$IMAGE:latest"
