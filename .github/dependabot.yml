version: 2

updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      aws:
        patterns: ["aws-*"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(ci)"
    groups:
      # init, analyze and upload-sarif are one release; bumping them apart
      # leaves CodeQL running mismatched halves.
      codeql-action:
        patterns: ["github/codeql-action/*"]

  # Base images in the Dockerfile, pinned by digest.
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(docker)"
