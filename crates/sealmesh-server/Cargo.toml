[package]
name = "sealmesh-server"
description = "Connection registry and query router for sealmesh daemons"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "AGPL-3.0-only"
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "../../README.md"
include = ["src/**", "Cargo.toml"]

[[bin]]
name = "sealmesh-server"
path = "src/main.rs"

[lib]
name = "sealmesh_server"
path = "src/lib.rs"

[features]
default = []
# Room history in DynamoDB instead of SQLite. Off by default: a self-hosted
# router needs no AWS SDK, account or credentials.
dynamodb = ["dep:aws-config", "dep:aws-sdk-dynamodb"]

[dependencies]
sealmesh-chat-wire = { workspace = true }
sealmesh-proto = { workspace = true }
sealmesh-wire = { workspace = true }

anyhow = { workspace = true }
aws-config = { workspace = true, optional = true }
aws-sdk-dynamodb = { workspace = true, optional = true }
axum = { workspace = true, features = ["ws"] }
reqwest = { workspace = true }
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "net", "sync"] }

# Test-only: a real WebSocket client, so room routing is exercised over the
# same `/v1/connect` transport a daemon uses — the frame cap, the handshake and
# the socket staying open on an undecodable frame are properties of that path,
# not of a function that could be called around it. Both are already in the
# workspace for the CLI's own client.
[dev-dependencies]
futures-util = { workspace = true }
tokio-tungstenite = { workspace = true }

[lints]
workspace = true
